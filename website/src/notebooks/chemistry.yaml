title: Chemistry energy
description: Score three guesses for a two-qubit toy molecule and keep the lowest.
order: 5
cells:
  - kind: markdown
    source: |
      The energy is `0.4 Z0 + 0.4 Z1 + 0.2 Z0 Z1`. Run the cell. The flipped state should score -0.6.

      Then add an `RY` on qubit 0 inside `both_flipped` and try a few angles. Does any angle beat -0.6?
  - kind: code
    source: |
      import math
      import numpy as np
      from fqkit import QuantumCircuit, Hadamard, RX, RY, CNOT, run

      np.set_printoptions(precision=4, suppress=True)

      def energy(build):
          qc = QuantumCircuit(2)
          build(qc)
          p = np.abs(run(qc)) ** 2
          z0 = (p[0] + p[1]) - (p[2] + p[3])
          z1 = (p[0] + p[2]) - (p[1] + p[3])
          zz = (p[0] + p[3]) - (p[1] + p[2])
          return qc, float(0.4 * z0 + 0.4 * z1 + 0.2 * zz)

      def product(qc):
          return None

      def bell(qc):
          qc.add_gate(Hadamard(), [0])
          qc.add_gate(CNOT(), [0, 1])

      def both_flipped(qc):
          qc.add_gate(RX(math.pi), [0])
          qc.add_gate(RX(math.pi), [1])

      for name, build in (("product", product), ("bell", bell), ("both flipped", both_flipped)):
          qc, score = energy(build)
          print(f"{name:14s} E = {score: .1f}")

      qc, score = energy(both_flipped)
      show(qc)
      plot(run(qc))
