[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fqkit"
version = "0.1.3"
description = "A lightweight Python framework for building and simulating quantum circuits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Felix Owusu" },
    { name = "Dr. Addo Dorcas Attuabea" },
]
maintainers = [
    { name = "Felix Owusu", email = "felixo6996@gmail.com" },
]
keywords = ["quantum", "quantum-computing", "simulator", "education", "qiskit"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
ibm = [
    "qiskit>=1.3",
    "qiskit-ibm-runtime>=0.30",
]
braket = [
    "amazon-braket-sdk>=1.88",
]
hardware = [
    "qiskit>=1.3",
    "qiskit-ibm-runtime>=0.30",
    "amazon-braket-sdk>=1.88",
]

[project.urls]
Homepage = "https://fqkit.vercel.app/"
Website = "https://fqkit.vercel.app/"
Repository = "https://github.com/Felixowusu20/Fqkit"

[project.scripts]
fqkit = "fqkit.__main__:main"

[tool.setuptools.packages.find]
include = ["fqkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
